[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-analytics-agent"
version = "0.5.0"
description = "Multi-agent toolkit for analyzing and managing Google Analytics 4 properties. Works with Claude Code, Codex, and Gemini CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Dilshat Rakhimov" }
]
dependencies = [
  # Upper bounds are load-bearing, not hygiene. Five Admin write paths and the
  # whole funnel surface import v1alpha types directly, and those imports are
  # function-local: a major bump that moves or removes v1alpha keeps the package
  # importable and the mocked suite green, then fails on the first live call.
  "google-analytics-data>=0.18.0,<1",
  "google-analytics-admin>=0.22.0,<1",
  "google-auth>=2.25.0,<3",
  "google-auth-oauthlib>=1.2.0,<2"
]

[project.optional-dependencies]
pdf = [
  "weasyprint>=60.0"
]
mcp = [
  "mcp>=1.2,<2"
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "mypy>=1.8.0",
  "mcp>=1.2,<2"
]

[project.scripts]
ga4-mcp = "ga4_mcp:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
  "ga4_auth",
  "ga4_admin",
  "ga4_audit",
  "ga4_benchmarks",
  "ga4_context",
  "ga4_data",
  "ga4_definitions",
  "ga4_events",
  "ga4_funnel",
  "ga4_mcp",
  "ga4_report",
  "ga4_utils"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly. Ruff's implicit default rule set changes between
# releases, which turns an unrelated ruff upgrade into a red CI run.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
ignore_missing_imports = true
exclude = "scripts/test_.*\\.py$|scripts/conftest\\.py$"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
